.capa{position:relative;width:960px;height:320px;overflow:hidden;background:var(--licit-bg-canvas);font-family:Sora,Arial,sans-serif}
svg{position:absolute;inset:0}

.texto{position:absolute;left:48px;bottom:40px;width:420px}
.nome{font-size:80px;line-height:.95;font-weight:500;letter-spacing:-0.035em;color:var(--licit-text-primary);margin:0}
.linha{font-size:14px;line-height:20px;color:var(--licit-text-secondary);margin:16px 0 0}
